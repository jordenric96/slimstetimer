<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>De Slimste Mens Timer</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --teal: #61A0AF;
            --light-blue: #96C9DC;
            --pink: #F06C9B;
            --light-pink: #F9B9B7;
            --yellow: #F5D491;
            --text-dark: #2c3e50;
        }

        /* Zorgt dat scrollen onmogelijk is en het exact 1 scherm vult */
        body, html {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            color: var(--text-dark);
            background: linear-gradient(-45deg, var(--light-pink), var(--light-blue), var(--yellow));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }

        *, *:before, *:after {
            box-sizing: inherit;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Scherm containers gebruiken nu Flexbox om de hoogte perfect te vullen */
        #setup-screen, #game-screen, #finale-screen, #winner-screen {
            display: none;
            width: 100%;
            height: 100%;
            padding: 10px;
            flex-direction: column;
        }

        #setup-screen.active, #game-screen.active, #finale-screen.active, #winner-screen.active {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* SPECIALE ANIMATIE WINNAAR */
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        #winner-screen.active .setup-container {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border-color: var(--yellow);
        }

        /* SETUP & WINNAAR CONTAINER */
        .setup-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 4px solid var(--teal);
            margin: auto; /* Centreert de box perfect in het midden */
            max-width: 600px;
            width: 100%;
        }

        input, select {
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            border: 2px solid var(--light-blue);
            background: #fff;
            font-size: 16px;
            font-weight: bold;
            color: var(--teal);
            outline: none;
        }

        button {
            background-color: var(--pink);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.15);
        }

        /* BOVENSTE NAVIGATIE BALK (Ronde Info) */
        .round-info {
            flex: 0 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 10px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--yellow);
        }

        .round-info h2 {
            margin: 0;
            font-size: clamp(20px, 4vh, 32px); /* Schaalt dynamisch mee */
        }

        .btn-next { background-color: var(--teal); font-size: clamp(14px, 2.5vh, 20px); padding: 1vh 2vw; }
        .btn-finale-nav { background-color: var(--pink); font-size: clamp(14px, 2.5vh, 20px); padding: 1vh 2vw; }

        /* TIMERS CONTAINER (De overige hoogte) */
        .timers-container {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: nowrap; /* Zorgt dat ze altijd naast elkaar staan */
            height: 100%;
        }

        /* INDIVIDUELE TIMER BLOKKEN */
        .timer-box {
            flex: 1 1 0; /* Gelijke breedte voor alle spelers */
            background-color: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2vh 1vw;
            border: 4px solid var(--light-blue);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .timer-box.active-timer {
            border-color: var(--pink);
            background-color: var(--light-pink);
            transform: scale(1.02);
            z-index: 2;
        }

        .player-name { 
            font-size: clamp(18px, 3.5vh, 28px); 
            font-weight: 900; 
            color: var(--teal); 
            text-transform: uppercase; 
        }
        
        .score-display { 
            font-size: clamp(50px, 12vh, 120px); 
            font-weight: 900; 
            color: var(--pink); 
            margin: 0; 
            transition: transform 0.1s; 
        }

        /* KNOPPEN IN DE TIMER */
        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            width: 100%; 
        }
        
        .controls button { 
            padding: 2vh 1vw; 
            font-size: clamp(16px, 3vh, 24px); 
            width: 100%; 
            border-radius: 10px;
        }

        .btn-play { background-color: var(--teal); color: white; }
        .btn-add { background-color: var(--light-blue); color: #fff; }
        .finale-drop-btn { background-color: var(--pink); }

    </style>
</head>
<body>

    <!-- SETUP SCHERM -->
    <div id="setup-screen" class="active">
        <div class="setup-container">
            <h2 style="color: var(--teal); margin-top:0;">Nieuw Spel Starten</h2>
            <div style="margin-bottom: 10px;">
                <label style="font-weight: bold; color: var(--teal);">Aantal spelers:</label>
                <select id="player-count" onchange="updatePlayerInputs()">
                    <option value="2">2 Spelers</option>
                    <option value="3" selected>3 Spelers</option>
                    <option value="4">4 Spelers</option>
                </select>
            </div>
            <div id="name-inputs"></div>
            <div style="margin: 15px 0;">
                <label style="font-weight: bold; color: var(--teal);">Starttijd (sec):</label>
                <input type="number" id="start-time" value="60" style="width: 80px; text-align: center;">
            </div>
            <button onclick="startGame()" style="font-size: 20px; padding: 10px 40px; background-color: var(--teal);">Start 🚀</button>
        </div>
    </div>

    <!-- GAME SCHERM -->
    <div id="game-screen">
        <div class="round-info">
            <h2 id="round-title" style="color: var(--pink);">Ronde 1: 3-6-9</h2>
            <button id="next-round-btn" class="btn-next" onclick="nextRound()">Volgende Ronde ➔</button>
        </div>
        <div class="timers-container" id="timers-container"></div>
    </div>

    <!-- FINALE SCHERM -->
    <div id="finale-screen">
        <div class="round-info" style="justify-content: center; border-bottom: 5px solid var(--pink);">
            <h2 style="color: var(--pink);">🔥 DE FINALE 🔥</h2>
        </div>
        <div class="timers-container" id="finale-timers-container"></div>
    </div>

    <!-- WINNAAR SCHERM -->
    <div id="winner-screen">
        <div class="setup-container" style="padding: 40px 20px;">
            <h2 style="color: var(--pink); font-size: clamp(30px, 5vh, 45px); margin: 0;">🎉 WINNAAR! 🎉</h2>
            <h1 id="winner-name" style="color: var(--teal); font-size: clamp(40px, 8vh, 80px); text-transform: uppercase; margin: 15px 0;">NAAM</h1>
            <p style="font-size: clamp(18px, 3vh, 26px); font-weight: bold; color: var(--text-dark); margin-bottom: 30px;">Is De Slimste Mens ter Wereld!</p>
            <button onclick="location.reload()" style="font-size: clamp(16px, 3vh, 24px); padding: 15px 40px; background-color: var(--teal);">Nieuw Spel Spelen</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error("Service Worker mislukt", err));
        }

        let players = [];
        let activeInterval = null;
        let activePlayerIndex = null;
        let finaleFinalists = []; // Slaat op wie er in de finale zitten
        
        // Exacte configuratie
        const roundsConfig = [
            { name: "3-6-9", points: [20] },
            { name: "Open deur", points: [40] },
            { name: "Puzzel", points: [40] },
            { name: "Ingelijst", points: [20] }
        ];
        let currentRoundIndex = 0;

        function bumpScoreEl(index, prefix = 'score-') {
            const el = document.getElementById(`${prefix}${index}`);
            if (el) {
                el.style.transform = 'scale(1.2)';
                setTimeout(() => el.style.transform = 'scale(1)', 150);
            }
        }

        function updatePlayerInputs() {
            const count = document.getElementById('player-count').value;
            const container = document.getElementById('name-inputs');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `<input type="text" id="p-name-${i}" placeholder="Speler ${i+1}" value="Speler ${i+1}" style="width: calc(100% - 20px);">`;
            }
        }

        function startGame() {
            const count = document.getElementById('player-count').value;
            const startTime = parseInt(document.getElementById('start-time').value);
            
            players = [];
            currentRoundIndex = 0;
            
            for (let i = 0; i < count; i++) {
                const name = document.getElementById(`p-name-${i}`).value;
                players.push({ name: name, score: startTime, id: i });
            }

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            updateRoundUI();
        }

        function updateRoundUI() {
            document.getElementById('round-title').innerText = `Ronde ${currentRoundIndex + 1}: ` + roundsConfig[currentRoundIndex].name;
            
            const nextBtn = document.getElementById('next-round-btn');
            if (currentRoundIndex === roundsConfig.length - 1) {
                nextBtn.innerText = "🚨 NAAR DE FINALE 🚨";
                nextBtn.className = "btn-finale-nav";
            } else {
                nextBtn.innerText = "Volgende Ronde ➔";
                nextBtn.className = "btn-next";
            }
            renderTimers();
        }

        function nextRound() {
            if (currentRoundIndex < roundsConfig.length - 1) {
                currentRoundIndex++;
                updateRoundUI();
            } else {
                startFinale();
            }
        }

        function renderTimers() {
            const container = document.getElementById('timers-container');
            container.innerHTML = '';
            const currentPoints = roundsConfig[currentRoundIndex].points;

            players.forEach((player, index) => {
                let pointsButtonsHtml = '';
                currentPoints.forEach(pts => {
                    pointsButtonsHtml += `<button class="btn-add" onclick="adjustScore(${index}, ${pts})">+${pts}</button>`;
                });

                container.innerHTML += `
                    <div class="timer-box" id="box-${index}">
                        <div class="player-name">${player.name}</div>
                        <div class="score-display" id="score-${index}">${player.score}</div>
                        <div class="controls">
                            <button class="btn-play" onclick="toggleTimer(${index})">▶ Start / Stop</button>
                            ${pointsButtonsHtml}
                        </div>
                    </div>
                `;
            });
            
            if (activePlayerIndex !== null) {
                const activeBox = document.getElementById(`box-${activePlayerIndex}`);
                if (activeBox) activeBox.classList.add('active-timer');
            }
        }

        function adjustScore(index, amount) {
            players[index].score += amount;
            updateDisplay();
            bumpScoreEl(index);
        }

        function toggleTimer(index) {
            if (activeInterval) {
                clearInterval(activeInterval);
                activeInterval = null;
                document.querySelectorAll('.timer-box').forEach(b => b.classList.remove('active-timer'));
                if (activePlayerIndex === index) {
                    activePlayerIndex = null;
                    return;
                }
            }

            activePlayerIndex = index;
            document.getElementById(`box-${index}`).classList.add('active-timer');
            bumpScoreEl(index);
            
            activeInterval = setInterval(() => {
                if (players[activePlayerIndex].score > 0) {
                    players[activePlayerIndex].score--;
                    updateDisplay();
                } else {
                    toggleTimer(activePlayerIndex);
                }
            }, 1000);
        }

        function updateDisplay() {
            players.forEach((player, index) => {
                const scoreEl = document.getElementById(`score-${index}`);
                if (scoreEl) scoreEl.innerText = player.score;
                
                const finaleScoreEl = document.getElementById(`f-score-${index}`);
                if (finaleScoreEl) finaleScoreEl.innerText = player.score;
            });
        }

        // --- FINALE LOGICA --- //
        function startFinale() {
            if (activeInterval) clearInterval(activeInterval);
            
            let sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            finaleFinalists = sortedPlayers.slice(0, 2);

            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('finale-screen').classList.add('active');

            const container = document.getElementById('finale-timers-container');
            container.innerHTML = '';

            finaleFinalists.forEach((player, i) => {
                let opponent = finaleFinalists[i === 0 ? 1 : 0];
                
                container.innerHTML += `
                    <div class="timer-box" id="f-box-${player.id}" style="width: 48%; max-width: 500px; margin: 0 auto;">
                        <div class="player-name">${player.name}</div>
                        <div class="score-display" id="f-score-${player.id}">${player.score}</div>
                        <div class="controls">
                            <button class="btn-play" onclick="toggleFinaleTimer(${player.id})">▶ Tijd Loopt / Stop</button>
                            <button class="finale-drop-btn" onclick="dropOpponentScore(${opponent.id}, 20)">📉 -20 bij ${opponent.name}</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleFinaleTimer(id) {
            if (activeInterval) {
                clearInterval(activeInterval);
                activeInterval = null;
                document.querySelectorAll('.timer-box').forEach(b => b.classList.remove('active-timer'));
                if (activePlayerIndex === id) {
                    activePlayerIndex = null;
                    return;
                }
            }

            activePlayerIndex = id;
            document.getElementById(`f-box-${id}`).classList.add('active-timer');
            bumpScoreEl(id, 'f-score-');
            
            activeInterval = setInterval(() => {
                let p = players.find(p => p.id === activePlayerIndex);
                if (p.score > 0) {
                    p.score--;
                    updateDisplay();
                    
                    // Controleer of de tijd op 0 is gevallen tijdens het lopen
                    if (p.score <= 0) {
                        declareWinner(p.id); // De speler waarvan de tijd net afliep verliest.
                    }
                }
            }, 1000);
        }

        function dropOpponentScore(opponentId, amount) {
            let opp = players.find(p => p.id === opponentId);
            opp.score -= amount;
            
            if (opp.score <= 0) {
                opp.score = 0;
                updateDisplay();
                declareWinner(opponentId); // De speler die onder 0 wordt geklikt verliest.
            } else {
                updateDisplay();
                bumpScoreEl(opponentId, 'f-score-');
            }
        }

        function declareWinner(loserId) {
            if (activeInterval) clearInterval(activeInterval);
            
            // Zoek wie de winnaar is (de finalist die NIET de loserId heeft)
            let winner = finaleFinalists.find(p => p.id !== loserId);
            
            document.getElementById('finale-screen').classList.remove('active');
            document.getElementById('winner-screen').classList.add('active');
            
            // Zet de naam van de winnaar in het scherm
            document.getElementById('winner-name').innerText = winner.name;
        }

        updatePlayerInputs();
    </script>
</body>
</html>
