<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>De Slimste Mens</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            /* Kleurenpalet */
            --teal: #61A0AF;
            --light-blue: #96C9DC;
            --pink: #F06C9B;
            --light-pink: #F9B9B7;
            --yellow: #F5D491;
            
            --bg-color: #fcfcfc;
            --text-dark: #2c3e50;
        }

        /* Dynamische, bewegende achtergrond */
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: var(--text-dark);
            background: linear-gradient(-45deg, var(--light-pink), var(--light-blue), var(--yellow));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 2.5em;
            text-shadow: 2px 4px 0px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        /* Containers */
        #setup-screen, #game-screen, #finale-screen {
            display: none;
            max-width: 1100px;
            margin: 0 auto;
        }

        #setup-screen.active, #game-screen.active, #finale-screen.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .setup-container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border: 4px solid var(--teal);
            margin-top: 30px;
        }

        input, select {
            padding: 12px;
            margin: 10px 5px;
            border-radius: 12px;
            border: 2px solid var(--light-blue);
            background: #fff;
            font-size: 16px;
            font-weight: bold;
            color: var(--teal);
            outline: none;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--pink);
            box-shadow: 0 0 10px var(--light-pink);
        }

        button {
            background-color: var(--pink);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 4px 0px rgba(0,0,0,0.15);
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 10px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.15);
        }

        /* Ronde Navigatie Balk */
        .round-info {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-bottom: 5px solid var(--yellow);
        }

        .btn-next {
            background-color: var(--teal);
            font-size: 18px;
            padding: 10px 20px;
        }

        .btn-finale-nav {
            background-color: var(--pink);
            font-size: 18px;
            padding: 10px 20px;
            animation: bounceIn 2s infinite;
        }

        .timers-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        /* Timer Blokken */
        .timer-box {
            background-color: white;
            width: 22%;
            min-width: 220px;
            height: 400px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 25px 15px;
            box-sizing: border-box;
            border: 4px solid var(--light-blue);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .timer-box::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 100px;
            height: 100px;
            background-color: var(--yellow);
            border-radius: 50%;
            opacity: 0.2;
        }

        .timer-box.active-timer {
            border-color: var(--pink);
            background-color: var(--light-pink);
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(240, 108, 155, 0.4);
            animation: pulseActive 1s infinite;
        }

        @keyframes pulseActive {
            0% { box-shadow: 0 0 0 0 rgba(240, 108, 155, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(240, 108, 155, 0); }
            100% { box-shadow: 0 0 0 0 rgba(240, 108, 155, 0); }
        }

        .player-name {
            font-size: 24px;
            font-weight: 900;
            color: var(--teal);
            text-transform: uppercase;
            z-index: 1;
        }

        .score-display {
            font-size: 75px;
            font-weight: 900;
            color: var(--pink);
            margin: 20px 0;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            z-index: 1;
            transition: transform 0.1s;
        }

        /* Knoppen binnen de timer */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
            z-index: 1;
        }

        .controls button {
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            flex-grow: 1;
        }

        .btn-play { 
            background-color: var(--teal); 
            color: white; 
            width: 100%; 
            font-size: 18px; 
            margin-bottom: 10px;
        }
        
        .btn-add { 
            background-color: var(--light-blue); 
            color: #fff;
            font-size: 18px;
        }

        /* Finale Specifiek */
        .finale-drop-btn {
            background-color: var(--pink);
            font-size: 20px;
            padding: 15px;
            width: 100%;
            margin-top: 5px;
        }

        @keyframes bounceIn {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

    </style>
</head>
<body>

    <h1>De Slimste Mens</h1>

    <!-- SETUP SCHERM -->
    <div id="setup-screen" class="active">
        <div class="setup-container">
            <h2 style="color: var(--teal); margin-top:0;">Start De Strijd!</h2>
            <div>
                <label style="font-weight: bold; color: var(--teal);">Aantal spelers:</label>
                <select id="player-count" onchange="updatePlayerInputs()">
                    <option value="2">2 Spelers</option>
                    <option value="3" selected>3 Spelers</option>
                    <option value="4">4 Spelers</option>
                </select>
            </div>
            <div id="name-inputs" style="margin: 20px 0;">
                <!-- Wordt via JS gevuld -->
            </div>
            <div>
                <label style="font-weight: bold; color: var(--teal);">Starttijd (sec):</label>
                <input type="number" id="start-time" value="60" style="width: 80px; text-align: center;">
            </div>
            <button onclick="startGame()" style="font-size: 20px; padding: 12px 40px; margin-top: 20px; background-color: var(--teal);">Start Het Spel 🚀</button>
        </div>
    </div>

    <!-- GAME SCHERM -->
    <div id="game-screen">
        <div class="round-info">
            <h2 id="round-title" style="margin:0; color: var(--pink); font-size: 28px;">Ronde: 3-6-9</h2>
            <button id="next-round-btn" class="btn-next" onclick="nextRound()">Volgende Ronde ➔</button>
        </div>
        <div class="timers-container" id="timers-container">
            <!-- Timers worden hier dynamisch gegenereerd -->
        </div>
    </div>

    <!-- FINALE SCHERM -->
    <div id="finale-screen">
        <div class="round-info" style="justify-content: center; border-bottom: 5px solid var(--pink);">
            <h2 style="margin:0; color: var(--pink); font-size: 30px;">🔥 DE FINALE 🔥</h2>
        </div>
        <div class="timers-container" id="finale-timers-container">
            <!-- Finale timers komen hier -->
        </div>
    </div>

    <script>
        let players = [];
        let activeInterval = null;
        let activePlayerIndex = null;
        
        // Configuratie van de rondes volgens de spelregels
        const roundsConfig = [
            { name: "3-6-9", points: [10] },
            { name: "Open Deur", points: [20] },
            { name: "Puzzel", points: [30] },
            { name: "Galerij", points: [15] },
            { name: "Collectief Geheugen", points: [10, 20, 30, 40, 50] }
        ];
        let currentRoundIndex = 0;

        function bumpScoreEl(index, prefix = 'score-') {
            const el = document.getElementById(`${prefix}${index}`);
            if (el) {
                el.style.transform = 'scale(1.3)';
                setTimeout(() => el.style.transform = 'scale(1)', 150);
            }
        }

        function updatePlayerInputs() {
            const count = document.getElementById('player-count').value;
            const container = document.getElementById('name-inputs');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `<input type="text" id="p-name-${i}" placeholder="Naam Speler ${i+1}" value="Speler ${i+1}">`;
            }
        }

        function startGame() {
            const count = document.getElementById('player-count').value;
            const startTime = parseInt(document.getElementById('start-time').value);
            
            players = [];
            currentRoundIndex = 0;
            
            for (let i = 0; i < count; i++) {
                const name = document.getElementById(`p-name-${i}`).value;
                players.push({ name: name, score: startTime, id: i });
            }

            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            updateRoundUI();
        }

        // Zorgt dat de titel en de juiste knoppen per ronde worden getoond
        function updateRoundUI() {
            // Update titel
            document.getElementById('round-title').innerText = "Ronde: " + roundsConfig[currentRoundIndex].name;
            
            // Update Volgende/Finale knop
            const nextBtn = document.getElementById('next-round-btn');
            if (currentRoundIndex === roundsConfig.length - 1) {
                nextBtn.innerText = "🚨 NAAR DE FINALE 🚨";
                nextBtn.className = "btn-finale-nav";
            } else {
                nextBtn.innerText = "Volgende Ronde ➔";
                nextBtn.className = "btn-next";
            }

            renderTimers();
        }

        function nextRound() {
            if (currentRoundIndex < roundsConfig.length - 1) {
                currentRoundIndex++;
                updateRoundUI();
            } else {
                startFinale();
            }
        }

        function renderTimers() {
            const container = document.getElementById('timers-container');
            container.innerHTML = '';
            
            const currentPoints = roundsConfig[currentRoundIndex].points;

            players.forEach((player, index) => {
                // Genereer dynamisch de +X seconden knoppen voor deze specifieke ronde
                let pointsButtonsHtml = '';
                currentPoints.forEach(pts => {
                    pointsButtonsHtml += `<button class="btn-add" onclick="adjustScore(${index}, ${pts})">+${pts}</button>`;
                });

                container.innerHTML += `
                    <div class="timer-box" id="box-${index}">
                        <div class="player-name">${player.name}</div>
                        <div class="score-display" id="score-${index}">${player.score}</div>
                        <div class="controls">
                            <button class="btn-play" onclick="toggleTimer(${index})">▶ Start/Stop</button>
                            ${pointsButtonsHtml}
                        </div>
                    </div>
                `;
            });
            
            // Zet actieve timer styling terug als er nog een loopt tijdens ronde wissel
            if (activePlayerIndex !== null) {
                const activeBox = document.getElementById(`box-${activePlayerIndex}`);
                if (activeBox) activeBox.classList.add('active-timer');
            }
        }

        function adjustScore(index, amount) {
            players[index].score += amount;
            updateDisplay();
            bumpScoreEl(index);
        }

        function toggleTimer(index) {
            if (activeInterval) {
                clearInterval(activeInterval);
                activeInterval = null;
                document.querySelectorAll('.timer-box').forEach(b => b.classList.remove('active-timer'));
                
                if (activePlayerIndex === index) {
                    activePlayerIndex = null;
                    return;
                }
            }

            activePlayerIndex = index;
            document.getElementById(`box-${index}`).classList.add('active-timer');
            bumpScoreEl(index);
            
            activeInterval = setInterval(() => {
                if (players[activePlayerIndex].score > 0) {
                    players[activePlayerIndex].score--;
                    updateDisplay();
                } else {
                    toggleTimer(activePlayerIndex);
                }
            }, 1000);
        }

        function updateDisplay() {
            players.forEach((player, index) => {
                const scoreEl = document.getElementById(`score-${index}`);
                if (scoreEl) scoreEl.innerText = player.score;
                
                const finaleScoreEl = document.getElementById(`f-score-${index}`);
                if (finaleScoreEl) finaleScoreEl.innerText = player.score;
            });
        }

        // FINALE LOGICA
        function startFinale() {
            if (activeInterval) clearInterval(activeInterval);
            
            let sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            let finalists = sortedPlayers.slice(0, 2);

            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('finale-screen').classList.add('active');

            const container = document.getElementById('finale-timers-container');
            container.innerHTML = '';

            finalists.forEach((player, i) => {
                let opponent = finalists[i === 0 ? 1 : 0];
                
                // In de finale kan je 1 tot 5 trefwoorden juist hebben, dus -10 tot -50 seconden bij de tegenstander
                container.innerHTML += `
                    <div class="timer-box" id="f-box-${player.id}" style="width: 45%; max-width: 400px; height: auto;">
                        <div class="player-name" style="font-size: 30px;">${player.name}</div>
                        <div class="score-display" id="f-score-${player.id}" style="font-size: 90px;">${player.score}</div>
                        <div class="controls" style="flex-direction: column; width: 100%;">
                            <button class="btn-play" style="padding: 15px; font-size: 20px; border-radius: 12px;" onclick="toggleFinaleTimer(${player.id})">▶ Tijd Loopt</button>
                            <div style="display: flex; gap: 5px; width: 100%;">
                                <button class="finale-drop-btn" onclick="dropOpponentScore(${opponent.id}, 10)">-10</button>
                                <button class="finale-drop-btn" onclick="dropOpponentScore(${opponent.id}, 20)">-20</button>
                                <button class="finale-drop-btn" onclick="dropOpponentScore(${opponent.id}, 30)">-30</button>
                            </div>
                            <div style="display: flex; gap: 5px; width: 100%;">
                                <button class="finale-drop-btn" onclick="dropOpponentScore(${opponent.id}, 40)">-40</button>
                                <button class="finale-drop-btn" onclick="dropOpponentScore(${opponent.id}, 50)">-50</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function toggleFinaleTimer(id) {
            if (activeInterval) {
                clearInterval(activeInterval);
                activeInterval = null;
                document.querySelectorAll('.timer-box').forEach(b => b.classList.remove('active-timer'));
                if (activePlayerIndex === id) {
                    activePlayerIndex = null;
                    return;
                }
            }

            activePlayerIndex = id;
            document.getElementById(`f-box-${id}`).classList.add('active-timer');
            bumpScoreEl(id, 'f-score-');
            
            activeInterval = setInterval(() => {
                let p = players.find(p => p.id === activePlayerIndex);
                if (p.score > 0) {
                    p.score--;
                    updateDisplay();
                } else {
                    toggleFinaleTimer(activePlayerIndex);
                }
            }, 1000);
        }

        function dropOpponentScore(opponentId, amount) {
            let opp = players.find(p => p.id === opponentId);
            opp.score -= amount;
            if (opp.score < 0) opp.score = 0;
            updateDisplay();
            bumpScoreEl(opponentId, 'f-score-');
        }

        // Init
        updatePlayerInputs();
    </script>
</body>
</html>
